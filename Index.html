<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DATVECHAI · khói sương & bụi li ti</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #d4e9d6;
            font-family: 'Quicksand', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        .fog-overlay {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(circle at 30% 40%, rgba(200, 235, 200, 0.25) 0%, transparent 60%),
                        radial-gradient(circle at 70% 80%, rgba(180, 230, 180, 0.2) 0%, transparent 50%),
                        radial-gradient(circle at 10% 80%, rgba(210, 240, 210, 0.15) 0%, transparent 40%);
            filter: blur(8px);
            animation: fogPulse 12s ease-in-out infinite alternate;
        }

        @keyframes fogPulse {
            0% { opacity: 0.4; transform: scale(1) rotate(0deg); }
            50% { opacity: 0.9; transform: scale(1.05) rotate(2deg); }
            100% { opacity: 0.5; transform: scale(0.95) rotate(-2deg); }
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            background: repeating-radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.03) 0px, transparent 80px),
                        repeating-radial-gradient(circle at 80% 70%, rgba(200, 240, 200, 0.04) 0px, transparent 100px);
            filter: blur(20px);
            animation: smokeDrift 18s linear infinite alternate;
            pointer-events: none;
        }

        @keyframes smokeDrift {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 0.3; }
            50% { transform: translate(30px, -20px) scale(1.2) rotate(5deg); opacity: 0.7; }
            100% { transform: translate(-20px, 30px) scale(0.9) rotate(-5deg); opacity: 0.4; }
        }

        .card {
            position: relative;
            z-index: 2;
            max-width: 880px;
            width: 100%;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(2px);
            border-radius: 48px;
            box-shadow: 0 20px 40px rgba(80, 120, 80, 0.2), 0 0 0 1px rgba(200, 235, 200, 0.3);
            padding: 30px 30px 30px;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        .web-header {
            display: flex;
            justify-content: center;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 12px 18px;
            margin-bottom: 18px;
        }

        .web-title {
            font-size: 3.4rem;
            font-weight: 700;
            letter-spacing: 6px;
            color: #1f4f2b;
            text-shadow: 0 4px 12px rgba(160, 210, 160, 0.5);
            line-height: 1.1;
        }

        .web-title small {
            font-size: 1rem;
            font-weight: 400;
            opacity: 0.6;
            letter-spacing: 4px;
            margin-left: 6px;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .social-links a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
            padding: 10px 20px;
            border-radius: 60px;
            text-decoration: none;
            font-weight: 600;
            color: #1f4f2b;
            font-size: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 12px rgba(60, 100, 60, 0.1);
            transition: all 0.2s;
            letter-spacing: 0.5px;
        }

        .social-links a i {
            font-size: 1.3rem;
            width: 1.6rem;
            text-align: center;
        }

        .social-links a:hover {
            background: rgba(255, 255, 255, 0.7);
            transform: scale(1.03);
            box-shadow: 0 6px 18px rgba(60, 120, 60, 0.2);
        }

        .social-links a .fab.fa-facebook { color: #1877f2; }
        .social-links a .fab.fa-tiktok { color: #000; }
        .social-links a .fas.fa-phone-alt { color: #25d366; }

        .photo-frame {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            max-width: 600px;
            margin: 0 auto 20px;
            border-radius: 36px;
            overflow: hidden;
            box-shadow: 0 12px 30px rgba(60, 100, 60, 0.25);
            background: #b8d9ba;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        .photo-frame img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: relative;
            z-index: 1;
        }

        .dust-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            overflow: hidden;
            border-radius: 36px;
        }

        .dust-particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: radial-gradient(circle, rgba(255, 255, 240, 0.9) 0%, rgba(200, 230, 180, 0.3) 100%);
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(255, 255, 220, 0.6);
            animation: dustFloat 8s ease-in-out infinite alternate;
            opacity: 0.6;
        }

        @keyframes dustFloat {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 0.3; }
            100% { transform: translate(var(--tx, 40px), var(--ty, -30px)) scale(1.8) rotate(360deg); opacity: 1; }
        }

        .orbit-ring {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
            border-radius: 36px;
        }

        .orbiting-circle {
            position: absolute;
            width: 28px;
            height: 28px;
            background: radial-gradient(circle at 30% 30%, #d4f0d0, #8fc98a);
            border-radius: 50%;
            box-shadow: 0 0 20px #b3e0b0, 0 0 8px #c6f0c0;
            top: 50%;
            left: 50%;
            transform-origin: center;
            margin-left: -14px;
            margin-top: -14px;
            animation: orbitMove 10s linear infinite;
            border: 1px solid rgba(255, 255, 240, 0.7);
        }

        @keyframes orbitMove {
            0% { transform: rotate(0deg) translateX(140px) rotate(0deg); }
            100% { transform: rotate(360deg) translateX(140px) rotate(-360deg); }
        }

        .orbiting-circle.reverse {
            width: 20px;
            height: 20px;
            margin-left: -10px;
            margin-top: -10px;
            background: radial-gradient(circle at 30% 30%, #f0fae8, #a8d6a0);
            box-shadow: 0 0 20px #b8e0b0;
            animation: orbitMoveReverse 14s linear infinite;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        @keyframes orbitMoveReverse {
            0% { transform: rotate(0deg) translateX(100px) rotate(0deg); }
            100% { transform: rotate(-360deg) translateX(100px) rotate(360deg); }
        }

        .orbiting-circle.inner {
            width: 16px;
            height: 16px;
            margin-left: -8px;
            margin-top: -8px;
            background: radial-gradient(circle at 30% 30%, #e4f8dc, #82b87a);
            animation: orbitMoveInner 8s linear infinite;
            box-shadow: 0 0 20px #a8d8a0;
        }

        @keyframes orbitMoveInner {
            0% { transform: rotate(0deg) translateX(60px) rotate(0deg); }
            100% { transform: rotate(360deg) translateX(60px) rotate(-360deg); }
        }

        @media (max-width: 640px) {
            .web-title { font-size: 2.8rem; letter-spacing: 3px; }
            .web-title small { font-size: 0.8rem; display: block; margin-left: 0; }
            .web-header { flex-direction: column; align-items: center; gap: 6px; }
            .social-links a { padding: 6px 14px; font-size: 0.85rem; gap: 4px; }
            .social-links { gap: 10px; }
            .photo-frame { max-width: 100%; }
            .orbiting-circle { width: 20px; height: 20px; margin-left: -10px; margin-top: -10px; }
            @keyframes orbitMove {
                0% { transform: rotate(0deg) translateX(90px) rotate(0deg); }
                100% { transform: rotate(360deg) translateX(90px) rotate(-360deg); }
            }
            @keyframes orbitMoveReverse {
                0% { transform: rotate(0deg) translateX(65px) rotate(0deg); }
                100% { transform: rotate(-360deg) translateX(65px) rotate(360deg); }
            }
            @keyframes orbitMoveInner {
                0% { transform: rotate(0deg) translateX(40px) rotate(0deg); }
                100% { transform: rotate(360deg) translateX(40px) rotate(-360deg); }
            }
        }

        @media (max-width: 430px) {
            .web-title { font-size: 2.2rem; }
            .card { padding: 16px; }
        }

        .footer-note {
            text-align: center;
            margin-top: 12px;
            color: #1f4f2b;
            opacity: 0.5;
            font-size: 0.8rem;
            letter-spacing: 2px;
            border-top: 1px solid rgba(100, 140, 100, 0.15);
            padding-top: 12px;
        }
    </style>
</head>
<body>

    <div class="fog-overlay"></div>

    <div class="card">
        <div class="web-header">
            <span class="web-title">
                DATVECHAI
                <small>✦</small>
            </span>
        </div>

        <div class="social-links">
            <a href="https://www.facebook.com/share/1E7dzKMYPJ/" target="_blank">
                <i class="fab fa-facebook"></i> Facebook
            </a>
            <a href="https://www.tiktok.com/@nguyendat8752?_r=1&_t=ZS-98vOmJRlelw" target="_blank">
                <i class="fab fa-tiktok"></i> TikTok
            </a>
            <a href="tel:+84798514321">
                <i class="fas fa-phone-alt"></i> 0798514321
            </a>
        </div>

        <div class="photo-frame" id="photoFrame">
            <!-- THAY ẢNH CỦA BẠN VÀO ĐÂY -->
            <img src="https://picsum.photos/seed/datvechai/600/600" alt="DATVECHAI" id="mainImage" />

            <div class="dust-layer" id="dustLayer"></div>

            <div class="orbit-ring">
                <div class="orbiting-circle"></div>
                <div class="orbiting-circle reverse"></div>
                <div class="orbiting-circle inner"></div>
            </div>
        </div>

        <div class="footer-note">
            ✦ khói sương · bụi li ti bay vòng vòng ✦
        </div>
    </div>

    <script>
        (function() {
            const dustLayer = document.getElementById('dustLayer');
            if (dustLayer) {
                const count = 100;
                const fragment = document.createDocumentFragment();

                for (let i = 0; i < count; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'dust-particle';

                    const size = 2 + Math.random() * 6;
                    const x = Math.random() * 100;
                    const y = Math.random() * 100;
                    const duration = 6 + Math.random() * 12;
                    const delay = Math.random() * 10;
                    const tx = (Math.random() - 0.5) * 120;
                    const ty = (Math.random() - 0.5) * 120;

                    particle.style.width = size + 'px';
                    particle.style.height = size + 'px';
                    particle.style.left = x + '%';
                    particle.style.top = y + '%';
                    particle.style.setProperty('--tx', tx + 'px');
                    particle.style.setProperty('--ty', ty + 'px');
                    particle.style.animationDuration = duration + 's';
                    particle.style.animationDelay = delay + 's';
                    particle.style.opacity = 0.3 + Math.random() * 0.7;
                    const glow = 4 + Math.random() * 12;
                    particle.style.boxShadow = `0 0 ${glow}px rgba(255, 255, 220, ${0.3+Math.random()*0.5})`;

                    fragment.appendChild(particle);
                }
                dustLayer.appendChild(fragment);
            }
        })();
    </script>
</body>
              </html>
